spring.application.name=java-ai-demo

# Load local secrets from a gitignored .env file (see .env.example).
spring.config.import=optional:file:.env[.properties]

# --- OpenAI (chat + embeddings) ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-nano
spring.ai.openai.embedding.options.model=text-embedding-3-small

# --- PostgreSQL connection ---
spring.datasource.url=jdbc:postgresql://localhost:5433/demo
spring.datasource.username=demo
spring.datasource.password=demo

# --- Spring AI PgVector vector store ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# --- App-level toggle for the startup sample-document indexer ---
app.document-indexing.enabled=true

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

logging.level.just.demo=DEBUG
logging.level.org.springframework.ai=INFO
