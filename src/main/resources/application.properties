spring.application.name=java-ai-demo

# Load local secrets from a gitignored .env file (see .env.example).
spring.config.import=optional:file:.env[.properties]

# --- OpenAI (chat + embeddings) ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4.1-nano
spring.ai.openai.embedding.options.model=text-embedding-3-small

# --- Elasticsearch connection ---
spring.elasticsearch.uris=http://localhost:9200

# --- Spring AI Elasticsearch vector store ---
spring.ai.vectorstore.elasticsearch.initialize-schema=true
spring.ai.vectorstore.elasticsearch.index-name=rag-documents
spring.ai.vectorstore.elasticsearch.dimensions=1536
spring.ai.vectorstore.elasticsearch.similarity=cosine

# --- App-level toggle for the startup sample-document indexer ---
app.document-indexing.enabled=true

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

logging.level.just.demo=DEBUG
logging.level.org.springframework.ai=INFO
