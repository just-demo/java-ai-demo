# Only one vector store auto-configuration may register a VectorStore bean at a time.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration

# --- PostgreSQL connection ---
spring.datasource.url=jdbc:postgresql://localhost:5433/demo
spring.datasource.username=demo
spring.datasource.password=demo

# --- Spring AI PgVector vector store ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
